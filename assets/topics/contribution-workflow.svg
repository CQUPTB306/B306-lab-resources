<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="t d"><title id="t">一次文档贡献的流程</title><desc id="d">确认问题和来源，在新分支修改，预览检查并提交推送，发起 PR。Review 要求修改时回到同一分支继续迭代，通过审核后由维护者合并。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087579"/></marker></defs><rect width="760" height="210" rx="10" fill="#f3f6f6"/><g fill="white" stroke="#b8cecc"><rect x="15" y="30" width="160" height="88" rx="6"/><rect x="205" y="30" width="160" height="88" rx="6"/><rect x="395" y="30" width="160" height="88" rx="6"/><rect x="585" y="30" width="160" height="88" rx="6"/></g><g fill="#304c4b" font-size="19" font-family="sans-serif" text-anchor="middle"><text x="95" y="67">确认问题</text><text x="95" y="95">核对来源</text><text x="285" y="67">新建分支</text><text x="285" y="95">修改文档</text><text x="475" y="67">预览与检查</text><text x="475" y="95">提交并推送</text><text x="665" y="67">PR 与 Review</text><text x="665" y="95">维护者合并</text><text x="475" y="192" font-size="17">收到修改意见后，继续在同一分支迭代</text></g><g fill="none" stroke="#087579" stroke-width="2" marker-end="url(#a)"><path d="M175 74h26"/><path d="M365 74h26"/><path d="M555 74h26"/><path d="M665 118v36H285v-30"/></g></svg>
