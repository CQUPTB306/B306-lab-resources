<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc"><title id="title">嵌入式系统演进手机图</title><desc id="desc">纵向时间线概览专用控制、微处理器和微控制器、联网设备、边缘计算与 AI 的演进，同时标示各阶段持续存在的系统约束。</desc><defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.date{font-size:16px;font-weight:700;fill:#087a75}.head{font-size:20px;font-weight:700}.copy{font-size:16px;fill:#52676a}.num{font-size:14px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="400" height="700" rx="14" fill="#f5f8f7"/><text x="24" y="40" font-size="21" font-weight="700">能力在增加，旧约束仍存在</text><path d="M48 100V558" stroke="#a4b7b3" stroke-width="3"/><g><circle cx="48" cy="128" r="16" fill="#cb704d"/><text x="48" y="133" text-anchor="middle" class="num">1</text><rect x="78" y="93" width="294" height="106" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="96" y="122" class="date">20 世纪中期</text><text x="96" y="150" class="head">专用控制</text><text x="96" y="178" class="copy">电路逻辑紧贴机器和过程</text></g><g><circle cx="48" cy="255" r="16" fill="#168c88"/><text x="48" y="260" text-anchor="middle" class="num">2</text><rect x="78" y="220" width="294" height="106" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="96" y="249" class="date">1960s–70s</text><text x="96" y="277" class="head">微处理器 / MCU</text><text x="96" y="305" class="copy">控制逻辑可编程，固件普及</text></g><g><circle cx="48" cy="382" r="16" fill="#547a9f"/><text x="48" y="387" text-anchor="middle" class="num">3</text><rect x="78" y="347" width="294" height="106" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="96" y="376" class="date">1980s–2000s</text><text x="96" y="404" class="head">联网设备</text><text x="96" y="432" class="copy">远程通信带来安全和维护问题</text></g><g><circle cx="48" cy="509" r="16" fill="#8b6d96"/><text x="48" y="514" text-anchor="middle" class="num">4</text><rect x="78" y="474" width="294" height="106" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="96" y="503" class="date">2010s–至今</text><text x="96" y="531" class="head">边缘计算 / AI</text><text x="96" y="559" class="copy">隐私、功耗与模型维护成约束</text></g><rect x="24" y="610" width="352" height="60" rx="9" fill="#263b3e"/><text x="200" y="636" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">贯穿各阶段</text><text x="200" y="658" text-anchor="middle" font-size="15" fill="#e3ecea">实时性 · 可靠性 · 安全 · 可维护性</text></svg>