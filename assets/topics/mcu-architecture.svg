<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">MCU 里面发生了什么</title><desc id="desc">图分为处理与存储、片上互连、外设与外部信号三层。外部信号经外设采集，通过总线交换数据，CPU读取并更新系统状态。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.muted{fill:#52676a}.label{font-size:22px}.small{font-size:19px}.tiny{font-size:17px}.number{font-size:18px;font-weight:700;fill:#fff}.layer{font-size:17px;font-weight:700;letter-spacing:1px;fill:#52676a}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}text[fill="#087a75"]{fill:#087a75}</style></defs><rect width="800" height="740" rx="12" fill="#f5f8f7"/><text x="40" y="48" font-size="28" font-weight="700">MCU 里的计算如何连接到引脚？</text><text x="40" y="80" class="small muted">读图顺序：信号进入 → 外设采集 → 片上交换 → CPU 处理</text><text x="40" y="128" class="layer">01 / 处理与存储</text><rect x="40" y="148" width="345" height="118" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><circle cx="72" cy="180" r="16" fill="#168c88"/><text x="72" y="186" text-anchor="middle" class="number">1</text><text x="102" y="184" class="label" font-weight="700">CPU 核心</text><text x="65" y="224" class="small muted">寄存器 · 运算 · 异常响应</text><rect x="415" y="148" width="345" height="118" rx="10" fill="#fff" stroke="#52769a" stroke-width="2"/><text x="440" y="184" class="label" font-weight="700">片上存储</text><text x="440" y="219" font-size="17" class="muted">Flash：程序与常量</text><text x="440" y="244" font-size="17" class="muted">SRAM：运行数据</text><path d="M212 306V274" fill="none" stroke="#47666a" stroke-width="2.5" marker-end="url(#a)"/><path d="M587 266V306" fill="none" stroke="#47666a" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="314" width="720" height="76" rx="10" fill="#263b3e"/><text x="400" y="347" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">片上互连 / 总线</text><text x="400" y="375" text-anchor="middle" font-size="17" fill="#dce8e6">CPU、存储器和外设在这里交换读写请求</text><path d="M150 480V400" fill="none" stroke="#47666a" stroke-width="2.5" marker-end="url(#a)"/><text x="290" y="460" class="layer">02 / 外设与外部信号</text><rect x="40" y="480" width="220" height="116" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><circle cx="72" cy="512" r="16" fill="#d18a43"/><text x="72" y="518" text-anchor="middle" class="number">2</text><text x="102" y="518" class="label" font-weight="700">外设控制器</text><text x="60" y="558" class="small muted">GPIO · ADC · 定时器</text><text x="60" y="583" class="tiny muted">UART · SPI · I²C</text><rect x="290" y="480" width="220" height="116" rx="10" fill="#fff" stroke="#718388" stroke-width="2"/><text x="315" y="518" class="label" font-weight="700">时钟 / 复位</text><text x="315" y="555" font-size="17" class="muted">提供节拍与初态</text><text x="315" y="580" font-size="16" class="muted">事件通过中断通知 CPU</text><rect x="540" y="480" width="220" height="116" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><circle cx="572" cy="512" r="16" fill="#168c88"/><text x="572" y="518" text-anchor="middle" class="number">3</text><text x="602" y="518" class="label" font-weight="700">引脚与设备</text><text x="565" y="555" font-size="17" class="muted">传感器 · 通信 · 驱动</text><text x="565" y="580" font-size="16" class="muted">连接外部电路与环境</text><path d="M650 596V626H150V596" fill="none" stroke="#168c88" stroke-width="2.5" marker-end="url(#b)"/><text x="400" y="653" text-anchor="middle" font-size="16" fill="#087a75">外部信号经引脚进入外设，再由片上系统处理</text><rect x="40" y="673" width="720" height="42" rx="8" fill="#e8eeec"/><text x="400" y="701" text-anchor="middle" font-size="17">中断通知 CPU 处理事件；DMA 搬运数据也要占用总线</text></svg>