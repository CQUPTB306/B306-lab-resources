<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" aria-labelledby="title desc">
<title id="title">C 程序练习流程</title><desc id="desc">保存源码，编译与链接，运行本次程序，对照预期，再记录条件与结果。错误时定位原因并修正源码。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087579"/></marker></defs>
<rect width="360" height="540" rx="10" fill="#f3f6f6"/>
<g font-family="sans-serif" text-anchor="middle" fill="#304c4b" font-size="18">
<g fill="white" stroke="#b8cecc"><rect x="64" y="22" width="280" height="64" rx="6"/><rect x="64" y="122" width="280" height="78" rx="6"/><rect x="64" y="236" width="280" height="64" rx="6"/><rect x="64" y="336" width="280" height="64" rx="6"/></g>
<text x="204" y="61">1 保存源码</text><text x="204" y="153">2 编译与链接</text><text x="204" y="179" font-size="15">失败时先检查诊断</text><text x="204" y="275">3 运行本次生成的程序</text><text x="204" y="375">4 对照预期，验证结果</text>
<text x="200" y="464">记录环境、代码与输入</text><text x="200" y="495">留下输出和自己的解释</text>
<text x="41" y="222" font-size="16">定位</text><text x="41" y="248" font-size="16">修正</text>
</g>
<g fill="none" stroke="#087579" stroke-width="2" marker-end="url(#a)"><path d="M204 86v32"/><path d="M204 200v32"/><path d="M204 300v32"/><path d="M204 400v34"/><path d="M64 368H16V55h44"/></g>
