<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="t d"><title id="t">文档贡献流程</title><desc id="d">确认问题和来源，新建分支修改，预览检查与提交推送，发起 PR 供维护者审核合并。Review 后返回同一分支修改。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087579"/></marker></defs><rect width="360" height="410" rx="10" fill="#f3f6f6"/><g fill="white" stroke="#b8cecc"><rect x="70" y="20" width="275" height="58" rx="6"/><rect x="70" y="108" width="275" height="58" rx="6"/><rect x="70" y="196" width="275" height="58" rx="6"/><rect x="70" y="284" width="275" height="70" rx="6"/></g><g fill="#304c4b" font-size="18" font-family="sans-serif" text-anchor="middle"><text x="207" y="55">1 确认问题与来源</text><text x="207" y="143">2 在新分支修订</text><text x="207" y="231">3 检查、提交并推送</text><text x="207" y="313">4 PR 与 Review</text><text x="207" y="338" font-size="16">通过审核后由维护者合并</text><text x="180" y="387" font-size="16">有修改意见 → 在同一分支继续修订</text><text x="35" y="209" font-size="15">修改</text><text x="35" y="234" font-size="15">反馈</text></g><g fill="none" stroke="#087579" stroke-width="2" marker-end="url(#a)"><path d="M207 78v26"/><path d="M207 166v26"/><path d="M207 254v26"/><path d="M70 319H15V137h51"/></g></svg>
