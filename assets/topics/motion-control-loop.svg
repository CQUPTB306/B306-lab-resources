<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc"><title id="title">运动控制的级联反馈回路</title><desc id="desc">位置目标进入位置控制器，其输出作为速度设定；速度控制器输出电流或力矩设定；电流控制器产生驱动指令并控制电机与负载。位置、速度和电流传感器分别将实际值反馈到对应控制器。扰动作用于机械负载，限位、限流与急停独立保护系统。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><marker id="c" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#547a9f"/></marker><marker id="d" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b6d96"/></marker><marker id="e" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b66347"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.stage{font-size:22px;font-weight:700}.desc{font-size:18px;fill:#52676a}.small{font-size:17px}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="800" height="800" rx="12" fill="#f5f8f7"/><text x="40" y="50" font-size="28" font-weight="700">级联控制：每一环都接收设定并返回测量</text><text x="40" y="82" font-size="18" fill="#52676a">信号向下传递，测量反馈回到对应控制器</text><rect x="225" y="120" width="350" height="86" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="400" y="155" text-anchor="middle" class="stage">位置环</text><text x="400" y="184" text-anchor="middle" class="desc">位置目标 → 位置控制器 → 速度设定</text><path d="M400 206V239" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><text x="430" y="231" class="small">速度设定</text><rect x="225" y="246" width="350" height="86" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="400" y="281" text-anchor="middle" class="stage">速度环</text><text x="400" y="310" text-anchor="middle" class="desc">速度目标 → 速度控制器 → 电流设定</text><path d="M400 332V365" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><text x="430" y="357" class="small">电流 / 力矩设定</text><rect x="225" y="372" width="350" height="86" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="400" y="407" text-anchor="middle" class="stage">电流环</text><text x="400" y="436" text-anchor="middle" class="desc">电流目标 → 电流控制器 → 驱动指令</text><path d="M400 458V491" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="225" y="498" width="350" height="86" rx="10" fill="#263b3e"/><text x="400" y="533" text-anchor="middle" class="stage" fill="#fff">驱动器 + 电机 + 负载</text><text x="400" y="562" text-anchor="middle" font-size="18" fill="#dce8e6">电能转为力矩，负载变化形成扰动</text><path d="M660 520H586" stroke="#b66347" stroke-width="2" marker-end="url(#e)"/><text x="678" y="530" class="small" fill="#8e5128">扰动</text><rect x="225" y="625" width="350" height="82" rx="10" fill="#e7eeec" stroke="#9aaba8" stroke-width="2"/><text x="400" y="659" text-anchor="middle" class="stage">传感器测量实际状态</text><text x="400" y="688" text-anchor="middle" class="desc">编码器：位置 / 速度　·　传感器：电流</text><path d="M400 584V615" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><path d="M225 665H82V163H215" fill="none" stroke="#168c88" stroke-width="3" marker-end="url(#b)"/><text x="48" y="594" transform="rotate(-90 48 594)" class="small" fill="#087a75">位置反馈 → 位置环</text><path d="M225 680H132V289H215" fill="none" stroke="#547a9f" stroke-width="3" marker-end="url(#c)"/><text x="101" y="594" transform="rotate(-90 101 594)" class="small" fill="#547a9f">速度反馈 → 速度环</text><path d="M225 695H182V415H215" fill="none" stroke="#8b6d96" stroke-width="3" marker-end="url(#d)"/><text x="151" y="594" transform="rotate(-90 151 594)" class="small" fill="#72577d">电流反馈 → 电流环</text><rect x="615" y="625" width="145" height="82" rx="9" fill="#fff2e7" stroke="#d18a43" stroke-width="2"/><text x="687" y="658" text-anchor="middle" font-size="19" font-weight="700" fill="#8e5128">独立保护</text><text x="687" y="685" text-anchor="middle" font-size="17" fill="#705c50">限位 · 限流 · 急停</text><rect x="40" y="735" width="720" height="42" rx="8" fill="#e7eeec"/><text x="400" y="763" text-anchor="middle" font-size="18" fill="#24383b">各环速度、限幅和安全措施须按具体驱动器与机械系统设计</text></svg>
