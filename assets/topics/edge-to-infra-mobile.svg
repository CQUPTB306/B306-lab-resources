<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc"><title id="title">端侧到 AI 基础设施手机图</title><desc id="desc">AI 系统从设备经边缘节点、网络到云端数据中心，再将结果返回。每层承担不同计算职责和故障风险。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.head{font-size:20px;font-weight:700}.copy{font-size:16px;fill:#52676a}.num{font-size:14px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="400" height="700" rx="14" fill="#f5f8f7"/><text x="24" y="40" font-size="21" font-weight="700">一次请求穿过哪些系统层？</text><g><circle cx="48" cy="110" r="16" fill="#168c88"/><text x="48" y="115" text-anchor="middle" class="num">1</text><rect x="78" y="78" width="294" height="94" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="98" y="111" class="head">设备端</text><text x="98" y="141" class="copy">采集 · 本地控制 · 轻量推理</text></g><path d="M225 172V191" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="236" r="16" fill="#d18a43"/><text x="48" y="241" text-anchor="middle" class="num">2</text><rect x="78" y="204" width="294" height="94" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="98" y="237" class="head">边缘节点</text><text x="98" y="267" class="copy">汇聚 · 筛选 · 局部推理</text></g><path d="M225 298V317" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="362" r="16" fill="#547a9f"/><text x="48" y="367" text-anchor="middle" class="num">3</text><rect x="78" y="330" width="294" height="94" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="98" y="363" class="head">网络与服务入口</text><text x="98" y="393" class="copy">身份认证 · 时延 · 断网风险</text></g><path d="M225 424V443" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="488" r="16" fill="#8b6d96"/><text x="48" y="493" text-anchor="middle" class="num">4</text><rect x="78" y="456" width="294" height="94" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="98" y="489" class="head">云与数据中心</text><text x="98" y="519" class="copy">模型服务 · 训练 · 存储</text></g><path d="M372 503H386V125H372" fill="none" stroke="#168c88" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="210" y="579" text-anchor="middle" font-size="15" fill="#087a75">结果与配置返回设备</text><rect x="24" y="612" width="352" height="64" rx="9" fill="#263b3e"/><text x="200" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">整条链路都要考虑</text><text x="200" y="660" text-anchor="middle" font-size="15" fill="#e3ecea">权限 · 版本 · 隐私 · 降级 · 运维</text></svg>