<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="title desc"><title id="title">校园信息如何可靠核验</title><desc id="desc">五个步骤：明确个人与问题、找到对应的官方部门来源、检查发布日期和适用范围、按通知办理并留存记录；若官方信息冲突或不完整，则暂停并向正式业务渠道确认。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.step{font-size:23px;font-weight:700}.desc{font-size:18px;fill:#52676a}.idx{font-size:18px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}</style></defs><rect width="800" height="700" rx="12" fill="#f5f8f7"/><text x="40" y="50" font-size="28" font-weight="700">重要校园事务：先核实，再行动</text><text x="40" y="82" font-size="18" fill="#52676a">适用于校历、选课、资助、网络、图书馆等动态信息</text><path d="M103 143V520" stroke="#a4b7b3" stroke-width="4"/><g><circle cx="103" cy="158" r="21" fill="#168c88"/><text x="103" y="164" text-anchor="middle" class="idx">1</text><rect x="148" y="120" width="600" height="78" rx="9" fill="#fff" stroke="#d7e1de" stroke-width="2"/><text x="176" y="153" class="step">明确问题和适用对象</text><text x="176" y="181" class="desc">自己的年级、学院、学期与具体事项</text></g><path d="M448 198V222" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="103" cy="258" r="21" fill="#547a9f"/><text x="103" y="264" text-anchor="middle" class="idx">2</text><rect x="148" y="220" width="600" height="78" rx="9" fill="#fff" stroke="#d7e1de" stroke-width="2"/><text x="176" y="253" class="step">从学校官网找到主管部门</text><text x="176" y="281" class="desc">优先看教务、学院或业务部门正式通知</text></g><path d="M448 298V322" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="103" cy="358" r="21" fill="#d18a43"/><text x="103" y="364" text-anchor="middle" class="idx">3</text><rect x="148" y="320" width="600" height="78" rx="9" fill="#fff" stroke="#d7e1de" stroke-width="2"/><text x="176" y="353" class="step">核对日期、范围和版本</text><text x="176" y="381" class="desc">旧截图、群聊转发和搜索摘要只作线索</text></g><path d="M448 398V422" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="103" cy="458" r="21" fill="#568061"/><text x="103" y="464" text-anchor="middle" class="idx">4</text><rect x="148" y="420" width="600" height="78" rx="9" fill="#fff" stroke="#d7e1de" stroke-width="2"/><text x="176" y="453" class="step">按正式流程办理并留记录</text><text x="176" y="481" class="desc">保存通知、回执和办理结果</text></g><path d="M448 498V522" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="148" y="526" width="600" height="78" rx="9" fill="#fff2e7" stroke="#d18a43" stroke-width="2"/><text x="176" y="559" font-size="22" font-weight="700" fill="#8e5128">信息矛盾 / 缺失？暂停操作</text><text x="176" y="587" class="desc">通过学校公布的正式业务渠道再次确认</text><rect x="40" y="632" width="720" height="42" rx="8" fill="#263b3e"/><text x="400" y="660" text-anchor="middle" font-size="18" fill="#fff">不确定时先求证；不要提交密码、验证码或转账</text></svg>