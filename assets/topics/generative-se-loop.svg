<svg xmlns="http://www.w3.org/2000/svg" width="760" height="242" viewBox="0 0 760 242" role="img" aria-labelledby="t d"><title id="t">生成式软件工程反馈流程</title><desc id="d">人确定需求与验收条件，Agent 阅读仓库并提出方案，实施最小修改，运行检查并人工审查。若不符合要求则回到需求或实现；通过后记录限制并合并。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087579"/></marker></defs><rect width="760" height="242" rx="6" fill="#f3f6f6"/><g fill="#fff" stroke="#b8cecc"><rect x="16" y="30" width="160" height="98" rx="5"/><rect x="205" y="30" width="160" height="98" rx="5"/><rect x="394" y="30" width="160" height="98" rx="5"/><rect x="583" y="30" width="160" height="98" rx="5"/></g><g font-family="sans-serif" text-anchor="middle"><g fill="#087579" font-size="14"><text x="96" y="59">01 · 人</text><text x="285" y="59">02 · Agent + 人</text><text x="474" y="59">03 · Agent</text><text x="663" y="59">04 · 人 + 工具</text></g><g fill="#304c4b" font-size="18"><text x="96" y="87">需求与验收</text><text x="285" y="87">阅读与方案</text><text x="474" y="87">最小修改</text><text x="663" y="87">验证与审查</text></g><g fill="#687576" font-size="13"><text x="96" y="111">界定范围</text><text x="285" y="111">核对现状</text><text x="474" y="111">保持可回退</text><text x="663" y="111">确认真实结果</text></g><text x="380" y="217" fill="#40514e" font-size="15">失败或有歧义：回到需求或实现；通过后再合并并记录限制</text></g><g fill="none" stroke="#087579" stroke-width="2" marker-end="url(#a)"><path d="M176 79h25"/><path d="M365 79h25"/><path d="M554 79h25"/><path d="M663 128v46H96v-42"/><path d="M474 174v-42"/></g></svg>
