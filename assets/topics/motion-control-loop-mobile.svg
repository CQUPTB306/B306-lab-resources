<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 920" role="img" aria-labelledby="title desc"><title id="title">运动控制级联反馈手机图</title><desc id="desc">位置控制器将位置目标与编码器反馈形成的位置误差转换为速度设定；速度控制器结合速度反馈输出电流设定；电流控制器结合电流传感输出驱动指令，控制电机负载。保护措施独立列出。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.head{font-size:19px;font-weight:700}.copy{font-size:15px;fill:#52676a}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="400" height="920" rx="14" fill="#f5f8f7"/><text x="24" y="40" font-size="21" font-weight="700">位置、速度、电流：逐层闭环</text><text x="24" y="66" class="copy">控制设定向下传，测量值返回对应环节</text><rect x="28" y="92" width="344" height="132" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="50" y="125" class="head">位置环 / 较慢外环</text><text x="50" y="157" class="copy">输入：目标位置 - 编码器位置</text><text x="50" y="187" class="copy">控制器输出：速度设定</text><path d="M200 224V250" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><text x="220" y="245" class="copy">速度设定</text><rect x="28" y="258" width="344" height="132" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="50" y="291" class="head">速度环 / 中间环</text><text x="50" y="323" class="copy">输入：速度设定 - 编码器速度</text><text x="50" y="353" class="copy">控制器输出：电流 / 力矩设定</text><path d="M200 390V416" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><text x="220" y="411" class="copy">电流设定</text><rect x="28" y="424" width="344" height="132" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="50" y="457" class="head">电流环 / 较快内环</text><text x="50" y="489" class="copy">输入：电流设定 - 电流传感值</text><text x="50" y="519" class="copy">控制器输出：驱动指令</text><path d="M200 556V582" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="590" width="344" height="92" rx="10" fill="#263b3e"/><text x="200" y="626" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">驱动器 → 电机 → 负载</text><text x="200" y="654" text-anchor="middle" font-size="15" fill="#e3ecea">负载变化是扰动</text><rect x="28" y="704" width="344" height="92" rx="10" fill="#e5eeeb"/><text x="50" y="738" class="head">测量反馈返回对应环节</text><text x="50" y="764" class="copy">编码器位置 / 速度 → 位置 / 速度环</text><text x="50" y="786" class="copy">电流传感值 → 电流环</text><rect x="28" y="818" width="344" height="76" rx="10" fill="#fff2e7" stroke="#d18a43" stroke-width="2"/><text x="50" y="850" font-size="18" font-weight="700" fill="#8e5128">独立保护不可省</text><text x="50" y="878" class="copy">限位 · 限流 · 防护 · 硬件急停</text></svg>