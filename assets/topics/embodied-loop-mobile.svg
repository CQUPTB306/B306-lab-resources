<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" role="img" aria-labelledby="title desc"><title id="title">具身智能感知行动手机图</title><desc id="desc">感知、状态估计、决策和控制形成一条闭环，机器人动作改变环境，环境反馈成为新的传感器观测；运行记录用于评估与训练。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.head{font-size:19px;font-weight:700}.copy{font-size:15px;fill:#52676a}.num{font-size:14px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}</style></defs><rect width="400" height="800" rx="14" fill="#f5f8f7"/><text x="24" y="40" font-size="21" font-weight="700">智能体通过身体感知与行动</text><g><circle cx="48" cy="105" r="16" fill="#168c88"/><text x="48" y="110" text-anchor="middle" class="num">1</text><rect x="78" y="74" width="294" height="78" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="98" y="105" class="head">感知环境</text><text x="98" y="132" class="copy">相机 · 力觉 · 编码器</text></g><path d="M225 152V174" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="215" r="16" fill="#547a9f"/><text x="48" y="220" text-anchor="middle" class="num">2</text><rect x="78" y="184" width="294" height="78" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="98" y="215" class="head">估计当前状态</text><text x="98" y="242" class="copy">位置 · 速度 · 接触 · 不确定性</text></g><path d="M225 262V284" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="325" r="16" fill="#8b6d96"/><text x="48" y="330" text-anchor="middle" class="num">3</text><rect x="78" y="294" width="294" height="78" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="98" y="325" class="head">规划目标与动作</text><text x="98" y="352" class="copy">模型建议不等于安全动作</text></g><path d="M225 372V394" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="435" r="16" fill="#d18a43"/><text x="48" y="440" text-anchor="middle" class="num">4</text><rect x="78" y="404" width="294" height="78" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="98" y="435" class="head">安全控制与执行</text><text x="98" y="462" class="copy">限速 · 限力 · 急停 · 人工接管</text></g><path d="M225 482V504" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="78" y="512" width="294" height="68" rx="10" fill="#263b3e"/><text x="225" y="553" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">动作改变真实环境</text><path d="M354 580V602H386V113H372" fill="none" stroke="#168c88" stroke-width="3" marker-end="url(#b)"/><text x="202" y="599" text-anchor="middle" font-size="14" fill="#087a75">环境反馈成为下一次观测</text><rect x="78" y="634" width="294" height="90" rx="10" fill="#e5eeeb"/><text x="98" y="668" class="head">数据闭环</text><text x="98" y="696" class="copy">记录 → 评估 → 受控更新</text><text x="98" y="716" class="copy">仿真和真实环境都要验证</text></svg>