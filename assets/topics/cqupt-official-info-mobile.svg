<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" role="img" aria-labelledby="title desc"><title id="title">校园信息核验手机流程图</title><desc id="desc">依次明确问题、从学校官网找主管部门、核对适用对象和日期、按正式流程办理并保存记录。遇到冲突或信息不完整时暂停并正式求证。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.head{font-size:19px;font-weight:700}.copy{font-size:15px;fill:#52676a}.num{font-size:14px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="400" height="760" rx="14" fill="#f5f8f7"/><text x="24" y="40" font-size="21" font-weight="700">重要事务：核实后再行动</text><text x="24" y="66" class="copy">校历、选课、资助、网络等动态信息</text><g><circle cx="48" cy="120" r="16" fill="#168c88"/><text x="48" y="125" text-anchor="middle" class="num">1</text><rect x="78" y="88" width="294" height="86" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="98" y="122" class="head">明确问题和适用对象</text><text x="98" y="151" class="copy">年级 · 学院 · 学期 · 事项</text></g><path d="M225 174V195" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="232" r="16" fill="#547a9f"/><text x="48" y="237" text-anchor="middle" class="num">2</text><rect x="78" y="200" width="294" height="86" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="98" y="234" class="head">找学校官网与主管部门</text><text x="98" y="263" class="copy">优先查业务部门的正式通知</text></g><path d="M225 286V307" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="344" r="16" fill="#d18a43"/><text x="48" y="349" text-anchor="middle" class="num">3</text><rect x="78" y="312" width="294" height="86" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="98" y="346" class="head">核对日期、范围和版本</text><text x="98" y="375" class="copy">旧截图和转发只作线索</text></g><path d="M225 398V419" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="48" cy="456" r="16" fill="#568061"/><text x="48" y="461" text-anchor="middle" class="num">4</text><rect x="78" y="424" width="294" height="86" rx="10" fill="#fff" stroke="#d8e1de" stroke-width="2"/><text x="98" y="458" class="head">按正式流程办理</text><text x="98" y="487" class="copy">保存通知、回执与办理结果</text></g><path d="M225 510V531" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="78" y="538" width="294" height="94" rx="10" fill="#fff2e7" stroke="#d18a43" stroke-width="2"/><text x="98" y="572" font-size="18" font-weight="700" fill="#8e5128">信息冲突或缺失？</text><text x="98" y="602" class="copy">暂停操作，向正式渠道求证</text><rect x="24" y="662" width="352" height="68" rx="9" fill="#263b3e"/><text x="200" y="690" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">不要提供密码或验证码</text><text x="200" y="714" text-anchor="middle" font-size="15" fill="#e3ecea">不确定时先确认发布主体和日期</text></svg>