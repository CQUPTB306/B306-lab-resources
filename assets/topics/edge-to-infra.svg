<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" role="img" aria-labelledby="title desc"><title id="title">从嵌入式设备到 AI 基础设施</title><desc id="desc">一条纵向请求链连接设备、边缘节点、网络和云数据中心。主请求向下，结果沿另一条路径返回；身份、版本、观测、隐私和降级贯穿全程。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.muted{fill:#52676a}.stage{font-size:24px;font-weight:700}.body{font-size:19px}.num{font-size:18px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}</style></defs><rect width="800" height="750" rx="12" fill="#f5f8f7"/><text x="40" y="48" font-size="28" font-weight="700">AI 请求经过的不只是模型</text><text x="40" y="80" font-size="19" class="muted">沿链路看延迟、算力、连接与失效边界</text><path d="M106 147V574" stroke="#9db1ad" stroke-width="4"/><g><circle cx="106" cy="164" r="21" fill="#168c88"/><text x="106" y="170" text-anchor="middle" class="num">1</text><rect x="150" y="124" width="610" height="94" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="178" y="161" class="stage">设备端</text><text x="178" y="193" class="body muted">采集与安全控制　·　缓存/轻量推理　·　可离线</text></g><path d="M455 218V246" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="106" cy="291" r="21" fill="#d18a43"/><text x="106" y="297" text-anchor="middle" class="num">2</text><rect x="150" y="251" width="610" height="94" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="178" y="288" class="stage">边缘节点</text><text x="178" y="320" class="body muted">汇聚 / 筛选 / 缓冲　·　局部推理　·　现场维护</text></g><path d="M455 345V373" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="106" cy="418" r="21" fill="#547a9f"/><text x="106" y="424" text-anchor="middle" class="num">3</text><rect x="150" y="378" width="610" height="94" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="178" y="415" class="stage">网络与服务入口</text><text x="178" y="447" class="body muted">身份认证 / 加密　·　时延、拥塞与断网</text></g><path d="M455 472V500" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="106" cy="545" r="21" fill="#8b6d96"/><text x="106" y="551" text-anchor="middle" class="num">4</text><rect x="150" y="505" width="610" height="94" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="178" y="542" class="stage">云与数据中心</text><text x="178" y="574" class="body muted">模型服务 / 训练　·　存储、供电、散热与运维</text></g><path d="M760 550H784V164H760" fill="none" stroke="#168c88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"/><text x="445" y="630" text-anchor="middle" font-size="17" fill="#087a75">推理结果、状态与配置返回设备</text><rect x="40" y="672" width="720" height="48" rx="8" fill="#263b3e"/><text x="400" y="702" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">全链路都要考虑：权限 · 版本 · 可观测性 · 隐私 · 降级</text></svg>