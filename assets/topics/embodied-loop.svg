<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-labelledby="title desc"><title id="title">具身智能的感知与行动闭环</title><desc id="desc">机器人从传感器观察环境，经状态估计和任务策略生成动作，再由安全与低层控制驱动身体改变环境；环境反馈形成新的观测。日志与评估结果用于改进训练。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><marker id="b" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168c88"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.step{font-size:23px;font-weight:700}.desc{font-size:18px;fill:#52676a}.idx{font-size:18px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}</style></defs><rect width="800" height="760" rx="12" fill="#f5f8f7"/><text x="40" y="50" font-size="28" font-weight="700">智能体通过身体与世界交换信息</text><text x="40" y="82" font-size="18" fill="#52676a">高层决策给出目标，低层控制负责可执行与安全</text><path d="M104 140V552" stroke="#9db1ad" stroke-width="4"/><g><circle cx="104" cy="156" r="21" fill="#168c88"/><text x="104" y="162" text-anchor="middle" class="idx">1</text><rect x="150" y="118" width="610" height="82" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><text x="178" y="153" class="step">感知：传感器读取环境</text><text x="178" y="182" class="desc">相机 · 力觉 · 编码器；数据有噪声和延迟</text></g><path d="M455 200V222" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="104" cy="258" r="21" fill="#547a9f"/><text x="104" y="264" text-anchor="middle" class="idx">2</text><rect x="150" y="220" width="610" height="82" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="178" y="255" class="step">估计：形成当前状态判断</text><text x="178" y="284" class="desc">位置 · 速度 · 接触状态 · 不确定性</text></g><path d="M455 302V324" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="104" cy="360" r="21" fill="#8b6d96"/><text x="104" y="366" text-anchor="middle" class="idx">3</text><rect x="150" y="322" width="610" height="82" rx="10" fill="#fff" stroke="#8b6d96" stroke-width="2"/><text x="178" y="357" class="step">决策：规划目标或动作序列</text><text x="178" y="386" class="desc">模型可以建议动作，不代表动作一定安全</text></g><path d="M455 404V426" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><g><circle cx="104" cy="462" r="21" fill="#d18a43"/><text x="104" y="468" text-anchor="middle" class="idx">4</text><rect x="150" y="424" width="610" height="82" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><text x="178" y="459" class="step">控制：限速、限力并驱动执行器</text><text x="178" y="488" class="desc">碰撞监测 · 急停 · 人工接管</text></g><path d="M455 506V528" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="150" y="532" width="610" height="62" rx="10" fill="#263b3e"/><text x="455" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">身体动作改变真实环境</text><path d="M748 596V622H782V159H760" fill="none" stroke="#168c88" stroke-width="3" marker-end="url(#b)"/><rect x="150" y="630" width="610" height="78" rx="10" fill="#e6eeec"/><text x="178" y="662" font-size="21" font-weight="700">观测日志 → 评估 → 受控训练与更新</text><text x="178" y="691" font-size="18" fill="#52676a">仿真与真实环境都要测试失败边界</text></svg>