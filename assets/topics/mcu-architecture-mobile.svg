<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" role="img" aria-labelledby="title desc"><title id="title">MCU 架构手机图</title><desc id="desc">传感器的信号依次经过引脚、外设、片上总线进入 CPU；CPU 与 Flash、SRAM 交换数据，时钟复位与中断提供运行基础。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47666a"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24383b}.head{font-size:21px;font-weight:700}.copy{font-size:16px;fill:#52676a}.tag{font-size:15px;font-weight:700;fill:#fff}text[fill="#fff"]{fill:#fff}text[fill="#dce8e6"],text[fill="#e3ecea"]{fill:#e3ecea}</style></defs><rect width="400" height="650" rx="14" fill="#f5f8f7"/><text x="24" y="38" class="head">一次输入如何进入 MCU？</text><text x="24" y="64" class="copy">顺着信号看懂芯片内部</text><rect x="28" y="92" width="344" height="70" rx="10" fill="#fff" stroke="#168c88" stroke-width="2"/><circle cx="58" cy="127" r="17" fill="#168c88"/><text x="58" y="133" text-anchor="middle" class="tag">1</text><text x="88" y="123" class="head">引脚与传感器</text><text x="88" y="146" class="copy">外部信号进入芯片</text><path d="M200 162V184" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="190" width="344" height="82" rx="10" fill="#fff" stroke="#d18a43" stroke-width="2"/><circle cx="58" cy="231" r="17" fill="#d18a43"/><text x="58" y="237" text-anchor="middle" class="tag">2</text><text x="88" y="223" class="head">外设采样与转换</text><text x="88" y="249" class="copy">GPIO · ADC · 定时器 · 通信</text><path d="M200 272V294" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="300" width="344" height="74" rx="10" fill="#263b3e"/><text x="200" y="330" text-anchor="middle" class="head" fill="#fff">片上互连 / 总线</text><text x="200" y="355" text-anchor="middle" class="copy" fill="#e3ecea">数据在 CPU、存储器与外设间传递</text><path d="M200 374V396" stroke="#47666a" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="402" width="344" height="74" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="52" y="435" class="head">CPU 核心</text><text x="52" y="463" class="copy">读取状态、执行指令、更新输出</text><path d="M110 476V494" stroke="#47666a" stroke-width="2" marker-end="url(#a)"/><path d="M290 476V494" stroke="#47666a" stroke-width="2" marker-end="url(#a)"/><rect x="28" y="502" width="164" height="74" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="48" y="533" class="head">Flash</text><text x="48" y="558" class="copy">程序与常量</text><rect x="208" y="502" width="164" height="74" rx="10" fill="#fff" stroke="#547a9f" stroke-width="2"/><text x="228" y="533" class="head">SRAM</text><text x="228" y="558" class="copy">栈、数据与缓冲</text><rect x="28" y="594" width="344" height="40" rx="8" fill="#e5eeeb"/><text x="200" y="620" text-anchor="middle" class="copy">时钟定节拍 · 复位定初态 · 中断报事件</text></svg>