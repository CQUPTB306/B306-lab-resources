<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="t d"><title id="t">生成式软件工程反馈流程</title><desc id="d">从需求与验收开始，阅读仓库并提出方案，实施最小修改，运行检查并人工审查。不符合要求则返回需求或实现；通过后合并并记录限制。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087579"/></marker></defs><rect width="360" height="480" rx="6" fill="#f3f6f6"/><g fill="#fff" stroke="#b8cecc"><rect x="69" y="18" width="274" height="68" rx="5"/><rect x="69" y="112" width="274" height="68" rx="5"/><rect x="69" y="206" width="274" height="68" rx="5"/><rect x="69" y="300" width="274" height="68" rx="5"/></g><g font-family="sans-serif" text-anchor="middle"><g fill="#087579" font-size="13"><text x="206" y="42">01 · 人</text><text x="206" y="136">02 · Agent + 人</text><text x="206" y="230">03 · Agent</text><text x="206" y="324">04 · 人 + 工具</text></g><g fill="#304c4b" font-size="17"><text x="206" y="70">需求与验收</text><text x="206" y="164">阅读与方案</text><text x="206" y="258">最小修改</text><text x="206" y="352">验证与审查</text></g><g fill="#40514e" font-size="14"><text x="180" y="415">失败或有歧义：回到需求或实现</text><text x="180" y="444">通过后再合并并记录限制</text></g><text x="35" y="231" fill="#687576" font-size="13">回退</text></g><g fill="none" stroke="#087579" stroke-width="2" marker-end="url(#a)"><path d="M206 86v22"/><path d="M206 180v22"/><path d="M206 274v22"/><path d="M69 334H18V52h47"/><path d="M18 240h47"/></g></svg>
